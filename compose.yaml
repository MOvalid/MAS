# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  masapi:
    image: masapi
    build:
      context: .
      dockerfile: backend/MasApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MasDatabase=Server=sqlserverdb;Database=MasDb;User Id=sa;Password=${SA_PASSWORD};
    ports:
      - 80:80
    depends_on:
      sqlserverdb:
        condition: service_healthy
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - 1433:1433
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null || exit 1" ]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  sqlserverdata: