# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  masapi:
    image: masapi
    build:
      context: .
      dockerfile: backend/MasApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Cognito__Authority=${Cognito__Authority}
      - Cognito__Audience=${Cognito__Audience}
      - ConnectionStrings__MasDatabase=Server=sqlserverdb;Database=MasDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - 80:80
    depends_on:
      sqlserverdb:
        condition: service_healthy
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - ACCEPT_EULA=Y
    ports:
      - 1433:1433
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null || exit 1" ]
      interval: 10s
      retries: 10
      start_period: 30s

  db-seeder:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserverdb:
        condition: service_healthy
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - SEED_DB=${SEED_DB:-N}
    volumes:
      - ./seed.sql:/seed.sql
    command: >
      /bin/bash -c "
      if [ '$SEED_DB' == 'Y' ]; then
        echo '--> SEED_DB is Y. Starting seeding process...';
        sleep 10; # Czekamy 10s, aby upewnić się, że migracje (EF Core) zdążyły utworzyć tabele
        /opt/mssql-tools18/bin/sqlcmd -S sqlserverdb -U sa -P \"$SA_PASSWORD\" -C -d MasDb -i /seed.sql;
        echo '--> Seeding completed.';
      else
        echo '--> SEED_DB is not Y (current value: $SEED_DB). Skipping seeding.';
      fi"

volumes:
  sqlserverdata: